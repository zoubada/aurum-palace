<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<title>Aurum Palace — Casino social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D12;--s1:#151923;--s2:#1C2130;--s3:#262C3F;--s4:#30374D;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --tx:#EEF0F6;--mu:#8B93A7;--mu2:#5F667A;
  --gold:#D4AF37;--g1:#F5D76E;--g2:#B8860B;
  --gg:linear-gradient(135deg,#F5D76E 0%,#D4AF37 45%,#B8860B 100%);
  --win:#10B981;--lose:#EF4444;
  --r:16px;--hh:60px;--side:248px;--nav:64px;
  --ff:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fd:'Playfair Display',Georgia,'Times New Roman',serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Le Palace est conçu en thème sombre : les jetons restent identiques en clair comme en sombre */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B0D12;--s1:#151923;--tx:#EEF0F6}}
:root[data-theme="dark"]{--bg:#0B0D12;--s1:#151923;--tx:#EEF0F6}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 var(--ff);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(900px 500px at 70% -10%,rgba(212,175,55,.10),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(16,185,129,.05),transparent 60%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
a{color:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g1);outline-offset:2px;border-radius:8px}
.i{flex:none;display:block}
.gold{color:var(--gold)}.mu{color:var(--mu)}.mu2{color:var(--mu2)}.pos{color:var(--win)}.neg{color:var(--lose)}
.gtext{background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Header ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:rgba(11,13,18,.84);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top-in{height:var(--hh);display:flex;align-items:center;gap:10px;padding:0 14px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;flex:none}
.logo-t{font-family:var(--fd);font-weight:800;font-size:19px;letter-spacing:.01em;line-height:1}
.logo-t small{display:block;font:600 9px/1.3 var(--ff);letter-spacing:.28em;color:var(--mu);margin-top:3px}
.hsearch{flex:1;max-width:380px;margin-left:18px;display:none;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line);color:var(--mu)}
.hsearch input{flex:1;background:none;border:0;outline:0;height:100%;font-size:14px;color:var(--tx);min-width:0}
.hsp{flex:1}
.bal{display:flex;align-items:center;gap:8px;height:40px;padding:0 4px 0 12px;border-radius:999px;background:var(--s2);border:1px solid var(--line2);font-weight:700;white-space:nowrap;transition:box-shadow .3s}
.bal .cur{color:var(--gold);font-size:15px}
.bal .v{font-size:15px;min-width:3ch;text-align:right}
.bal .add{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--gg);color:#231a02}
.bal.up{animation:balUp .7s}.bal.down{animation:balDn .5s}
@keyframes balUp{30%{box-shadow:0 0 0 3px rgba(16,185,129,.5),0 0 24px rgba(16,185,129,.4)}}
@keyframes balDn{30%{box-shadow:0 0 0 2px rgba(239,68,68,.35)}}
.hbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line);color:var(--mu);flex:none;text-decoration:none;position:relative;transition:color .15s,background .15s}
.hbtn:hover{color:var(--tx);background:var(--s3)}
.hbtn.fav.on{color:#F43F5E}.hbtn.fav.on svg{fill:currentColor}
.hbtn .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--win);box-shadow:0 0 0 2px var(--s2)}
.gift{color:var(--g1)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--s2);border:2px solid var(--lc,var(--gold));flex:none;text-decoration:none}
.hide-s{display:none}
@media(min-width:700px){.hide-s{display:grid}.hsearch{display:flex}}

/* ---------- Layout ---------- */
.side{position:fixed;top:calc(var(--hh) + env(safe-area-inset-top,0px));bottom:0;left:0;width:var(--side);background:var(--s1);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 24px;display:none;scrollbar-width:thin}
.side h6{margin:18px 12px 6px;font-size:11px;font-weight:600;color:var(--mu2);letter-spacing:.04em}
.sl{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--mu);text-decoration:none;font-weight:500;font-size:14px;transition:background .15s,color .15s}
.sl:hover{background:var(--s2);color:var(--tx)}
.sl.on{background:linear-gradient(90deg,rgba(212,175,55,.16),rgba(212,175,55,0));color:var(--g1)}
.sl .ct{margin-left:auto;font-size:11px;color:var(--mu2)}
.side-jp{margin:6px 4px 12px;padding:14px;border-radius:14px;background:radial-gradient(circle at 80% 0,rgba(245,215,110,.22),transparent 60%),#18140a;border:1px solid rgba(212,175,55,.3)}
.side-jp span{font-size:11px;color:var(--mu)}
.side-jp b{display:block;font-family:var(--fd);font-size:21px;margin-top:2px}
.main{padding:calc(var(--hh) + 16px) 14px calc(var(--nav) + 28px);max-width:1440px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(15,18,26,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.bnav-in{height:var(--nav);display:grid;grid-template-columns:repeat(5,1fr)}
.bn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mu2);text-decoration:none}
.bn.on{color:var(--g1)}
@media(min-width:1024px){.side{display:block}.main{margin-left:var(--side);padding:calc(var(--hh) + 22px) 28px 40px}.bnav{display:none}}

/* ---------- Generic ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;background:var(--s3);color:var(--tx);transition:transform .1s,filter .15s,opacity .15s;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.42}
.btn-gold{background:var(--gg);color:#231a02;box-shadow:0 6px 22px rgba(212,175,55,.28)}
.btn-green{background:linear-gradient(135deg,#34D399,#059669);color:#fff;box-shadow:0 6px 22px rgba(16,185,129,.28)}
.btn-red{background:linear-gradient(135deg,#F87171,#DC2626);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--line2)}
.btn-big{height:54px;font-size:17px;width:100%;border-radius:14px}
.btn-sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.pan{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec{margin:30px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h2{font-family:var(--fd);font-size:23px;font-weight:700;margin:0;line-height:1.2}
.sec a{color:var(--gold);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.ph{font-family:var(--fd);font-size:clamp(28px,6vw,38px);font-weight:800;margin:4px 0 6px;line-height:1.1}
.psub{color:var(--mu);margin:0 0 20px;max-width:62ch}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--mu);display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:.15s}
.chip:hover{color:var(--tx)}
.chip.on{background:rgba(212,175,55,.14);border-color:rgba(212,175,55,.55);color:var(--g1)}
.sel{height:36px;border-radius:10px;background:var(--s2);border:1px solid var(--line2);padding:0 10px;font-size:14px;color:var(--tx)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mu);font-weight:600}
.tin{height:44px;border-radius:12px;background:var(--bg);border:1px solid var(--line2);padding:0 12px;font-size:16px;color:var(--tx);outline:none;width:100%}
.tin:focus{border-color:var(--gold)}

/* ---------- Game cards ---------- */
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;scrollbar-width:none;margin:0 -2px}
.hs::-webkit-scrollbar{display:none}
.hs .gc{flex:0 0 clamp(128px,36vw,176px);scroll-snap-align:start}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:12px}
@media(min-width:700px){.ggrid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}}
.gc{position:relative;display:block;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;text-decoration:none;color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.35);transition:transform .25s,box-shadow .25s;isolation:isolate}
.gc:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 1px rgba(212,175,55,.65),0 0 30px rgba(212,175,55,.22)}
.gc .art{position:absolute;inset:0;display:grid;place-items:center;z-index:-1}
.gc .art::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.18),transparent 55%)}
.gc .art::after{content:"";position:absolute;inset:10px;border-radius:12px;border:1px solid rgba(255,255,255,.12)}
.gc .glyph{font-size:clamp(48px,13vw,66px);line-height:1;transform:translateY(-14%);filter:drop-shadow(0 8px 16px rgba(0,0,0,.5));transition:transform .35s}
.gc:hover .glyph{transform:translateY(-18%) scale(1.08)}
.gc .glyph svg{width:clamp(78px,22vw,110px);height:auto}
.gc .nm{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.82));font-family:var(--fd);font-weight:700;font-size:16px;line-height:1.15}
.gc .pv{display:block;font:500 11px var(--ff);color:rgba(255,255,255,.62);margin-top:4px}
.badge{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-radius:6px;background:var(--gg);color:#231a02}
.badge.hot{background:linear-gradient(135deg,#FB7185,#E11D48);color:#fff}
.badge.new{background:linear-gradient(135deg,#6EE7B7,#10B981);color:#032519}
.gfav{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.42);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.gfav.on{color:#F43F5E}.gfav.on svg{fill:currentColor}
.empty{padding:40px 20px;text-align:center;color:var(--mu);border:1px dashed var(--line2);border-radius:var(--r)}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}

/* ---------- Lobby ---------- */
.hero{position:relative;border-radius:22px;overflow:hidden;height:clamp(200px,48vw,320px);background:#120f07}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(20px,5vw,56px);opacity:0;transition:opacity .8s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide h3{font-family:var(--fd);font-size:clamp(26px,6.4vw,50px);line-height:1.02;margin:0 0 10px;max-width:14ch;font-weight:800}
.slide p{margin:0 0 18px;color:rgba(255,255,255,.78);max-width:36ch;font-size:clamp(13px,3.4vw,16px)}
.slide .deco{position:absolute;right:-4%;top:50%;transform:translateY(-50%);width:clamp(180px,48vw,420px);opacity:.95;pointer-events:none}
.slide .btn{align-self:flex-start;position:relative}
.dots{position:absolute;bottom:14px;left:clamp(20px,5vw,56px);display:flex;gap:6px;z-index:2}
.dots button{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.3);transition:width .3s}
.dots button.on{width:24px;background:var(--g1)}
.jp{margin-top:14px;border-radius:18px;padding:16px 18px;background:radial-gradient(600px 120px at 85% 0,rgba(245,215,110,.2),transparent),linear-gradient(90deg,#17130a,#1c1609);border:1px solid rgba(212,175,55,.35);display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.jp-l{font-size:12px;color:var(--mu);font-weight:600}
.jp-v{font-family:var(--fd);font-size:clamp(28px,7.5vw,44px);font-weight:800;line-height:1.05}
.jp-r{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--mu)}
.live{display:inline-flex;align-items:center;gap:7px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--win);box-shadow:0 0 0 0 rgba(16,185,129,.6);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}}
.tick{overflow:hidden;white-space:nowrap;margin-top:14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tick-in{display:inline-flex;gap:10px;animation:marq 70s linear infinite}
.tick:hover .tick-in{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
.tk{display:inline-flex;gap:8px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px}
.tk .g{color:var(--mu)}.tk .m{color:var(--win);font-weight:700}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
@media(min-width:760px){.cats{grid-template-columns:repeat(4,1fr)}}
.cat{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);text-decoration:none;transition:border-color .2s,background .2s}
.cat:hover{border-color:rgba(212,175,55,.45);background:var(--s2)}
.cat .ci{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:rgba(212,175,55,.12);color:var(--g1);flex:none}
.cat b{display:block;font-size:14px}.cat span{font-size:12px;color:var(--mu)}

/* ---------- Game page ---------- */
.gp-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.gp-t{flex:1;min-width:0}
.gp-t h1{font-family:var(--fd);font-size:clamp(22px,5.5vw,30px);margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp-t span{font-size:12px;color:var(--mu)}
.gp{display:grid;gap:16px;align-items:start}
@media(min-width:1180px){.gp{grid-template-columns:minmax(0,1fr) 330px}}
.stage{background:radial-gradient(ellipse at 50% 0,#1e2538,#11151f 72%);border:1px solid var(--line);border-radius:22px;padding:clamp(12px,3vw,22px);position:relative;overflow:hidden;min-width:0}
.ctrl{display:grid;gap:12px;margin-top:16px}
.ctrl-row{display:flex;gap:10px;align-items:stretch}
.ctrl-row>*{flex:1}
@media(min-width:760px){.ctrl.wide{grid-template-columns:1fr 1fr;align-items:end}}
.lbl{font-size:12px;color:var(--mu);font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.betctl .row{display:flex;gap:6px}
.betctl button{height:44px;min-width:44px;padding:0 10px;border-radius:11px;background:var(--s3);font-weight:700;font-size:13px;color:var(--mu);transition:color .15s,background .15s}
.betctl button:hover:not(:disabled){color:var(--tx);background:var(--s4)}
.inp{flex:1;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line2);border-radius:11px;padding:0 12px;min-width:0}
.inp:focus-within{border-color:var(--gold)}
.inp input{width:100%;min-width:0;background:none;border:0;color:var(--tx);font:700 16px var(--ff);height:42px;outline:none}
.inp input:disabled{opacity:.6}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px}
.tab{flex:1;height:34px;border-radius:9px;font-weight:600;font-size:13px;color:var(--mu)}
.tab.on{background:var(--s3);color:var(--tx)}
.gside{position:sticky;top:calc(var(--hh) + 20px)}
#gtab{margin-top:12px;max-height:540px;overflow-y:auto}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;font-size:13px;padding:9px 2px;border-bottom:1px solid var(--line);align-items:center}
.hrow:last-child{border-bottom:0}
.hrow .t{color:var(--mu);font-size:11px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.st{background:var(--bg);border-radius:12px;padding:12px}
.st b{display:block;font-size:17px}.st span{font-size:11.5px;color:var(--mu)}
.rules{font-size:13.5px;color:#C8CDD9;line-height:1.6}
.rules h4{font-family:var(--fd);font-size:17px;color:var(--tx);margin:14px 0 6px}
.rules h4:first-child{margin-top:0}
.rules p{margin:0 0 8px}
.ptab{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 10px}
.ptab td,.ptab th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.ptab th{color:var(--mu);font-weight:600;font-size:12px}
.ptab td:last-child,.ptab th:last-child{text-align:right}
.ptab tr.hit td{background:rgba(212,175,55,.14);color:var(--g1)}
.msg{text-align:center;min-height:26px;margin-top:12px;font-weight:600;font-size:15px}
.msg.w{color:var(--win)}.msg.l{color:var(--mu)}
.res{position:absolute;left:50%;top:50%;z-index:5;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;padding:14px 22px;border-radius:16px;background:rgba(11,13,18,.9);border:1px solid var(--line2);text-align:center;transition:.3s cubic-bezier(.2,.9,.3,1.3);white-space:nowrap}
.res.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.res b{display:block;font-family:var(--fd);font-size:26px}
.res.w{border-color:rgba(16,185,129,.6);box-shadow:0 0 40px rgba(16,185,129,.25)}.res.w b{color:var(--win)}
.res.l b{color:var(--lose)}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:28px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:700;background:var(--s3)}
.pill.g{background:rgba(16,185,129,.16);color:#34D399}.pill.r{background:rgba(239,68,68,.15);color:#F87171}.pill.y{background:rgba(212,175,55,.18);color:var(--g1)}
.hist-strip{display:flex;gap:6px;overflow:hidden;min-height:28px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mu)}
.seg button.on{background:var(--s3);color:var(--tx)}

/* ---------- Slots ---------- */
.slot-wrap{position:relative;max-width:620px;margin:0 auto}
.slot{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:6px;padding:10px;border-radius:18px;background:linear-gradient(#0c0e15,#161a26);border:2px solid rgba(212,175,55,.5);box-shadow:inset 0 0 40px rgba(0,0,0,.65),0 0 34px rgba(212,175,55,.12)}
.slot.fruit{border-color:rgba(217,70,239,.6);box-shadow:inset 0 0 40px rgba(0,0,0,.65),0 0 34px rgba(217,70,239,.25),0 0 0 4px rgba(217,70,239,.08)}
.reel{display:grid;grid-template-rows:repeat(var(--rows),1fr);gap:6px;border-radius:10px;overflow:hidden}
.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;position:relative;background:radial-gradient(circle at 50% 32%,#283047,#151923);transition:opacity .2s,box-shadow .2s}
.cell .sy{font-size:clamp(24px,8.4vw,48px);line-height:1}
.fruit .cell .sy{font-size:clamp(34px,13vw,64px)}
.cell .lt{font-family:var(--fd);font-weight:800;font-size:clamp(22px,7vw,40px);line-height:1}
.cell .ltb{width:68%;aspect-ratio:1;border-radius:13px;display:grid;place-items:center;position:relative;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -4px 8px rgba(0,0,0,.4),0 4px 10px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3)}
.cell .ltb::after{content:"";position:absolute;inset:0;border-radius:13px;background:linear-gradient(155deg,rgba(255,255,255,.4),transparent 45%)}
.cell .ltb i{position:relative;z-index:1;font-style:normal;font-family:var(--fd);font-weight:800;font-size:clamp(15px,5vw,24px);color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4)}
.cell .ltb[data-r="A"]{background:linear-gradient(145deg,#FB7185,#9F1239)}
.cell .ltb[data-r="K"]{background:linear-gradient(145deg,#60A5FA,#1E3A8A)}
.cell .ltb[data-r="Q"]{background:linear-gradient(145deg,#F472B6,#9D174D)}
.cell .ltb[data-r="J"]{background:linear-gradient(145deg,#34D399,#065F46)}
.cell .ltb[data-r="T"]{background:linear-gradient(145deg,#FBBF24,#92400E)}
.cell small{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:clamp(6px,1.8vw,9px);font-weight:800;letter-spacing:.08em;color:var(--g1)}
.reel.spin .cell{animation:rs .09s linear infinite}
.reel.spin .cell .sy,.reel.spin .cell .lt{filter:blur(3px)}
@keyframes rs{0%{transform:translateY(-10%)}100%{transform:translateY(10%)}}
.reel.stop{animation:land .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{transform:translateY(-8px)}100%{transform:none}}
.cell.w{box-shadow:0 0 0 2px var(--g1),0 0 20px rgba(245,215,110,.55);animation:glow .7s ease-in-out infinite alternate;z-index:1}
@keyframes glow{to{box-shadow:0 0 0 2px var(--g1),0 0 30px rgba(245,215,110,.9)}}
.cell.dim{opacity:.3}
.fsb{position:absolute;top:-14px;left:50%;transform:translateX(-50%);z-index:3;padding:5px 14px;border-radius:999px;background:var(--gg);color:#231a02;font-weight:800;font-size:12px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.slot-marquee{text-align:center;font-family:var(--fd);font-size:clamp(20px,5vw,28px);margin-bottom:12px;font-weight:800}

/* ---------- Roulette ---------- */
.rl{display:grid;gap:18px}
@media(min-width:900px){.rl{grid-template-columns:minmax(260px,360px) 1fr;align-items:start}}
.wheel-box{position:relative;width:min(340px,86vw);aspect-ratio:1;margin:0 auto}
.wheel-box svg{width:100%;height:100%;display:block;filter:drop-shadow(0 18px 34px rgba(0,0,0,.6))}
.wheel-ptr{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--g1);filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));z-index:2}
.rnum{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.rnum span{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:26px;opacity:0;transform:scale(.5);transition:.35s cubic-bezier(.2,.9,.3,1.4);box-shadow:0 0 0 3px var(--g1),0 8px 20px rgba(0,0,0,.6)}
.rnum span.show{opacity:1;transform:scale(1)}
.rt{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;user-select:none;-webkit-user-select:none}
.rc{position:relative;height:40px;display:grid;place-items:center;font-weight:700;border-radius:7px;font-size:14px;color:#fff;transition:filter .15s,box-shadow .2s}
.rc:hover{filter:brightness(1.25)}
.rc.red{background:#B4232A}.rc.blk{background:#232838}.rc.grn{background:#047857;grid-column:1/-1}
.rc.out{background:#18203a;border:1px solid var(--line2);font-size:12px}
.rc.hit{box-shadow:0 0 0 2px var(--g1),0 0 18px var(--g1);z-index:1}
.rt-out{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:4px}
.rt-out2{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:4px}
.chipmark{position:absolute;right:3px;top:50%;transform:translateY(-50%);min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 5px;font-size:10px;font-weight:800;color:#231a02;background:var(--gg);box-shadow:0 2px 6px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.45);animation:pop .25s}
@keyframes pop{0%{transform:translateY(-50%) scale(.3)}70%{transform:translateY(-50%) scale(1.15)}}
.chipsel{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cp{width:46px;height:46px;border-radius:50%;font-weight:800;font-size:11px;color:#fff;border:3px dashed rgba(255,255,255,.6);box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 0 0 4px rgba(0,0,0,.18);transition:transform .15s}
.cp.on{transform:translateY(-5px);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--g1),0 8px 16px rgba(0,0,0,.5)}
.rstat{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);align-items:center;justify-content:center;margin-top:12px}
.rstat .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-size:11px;font-weight:800;color:#fff;margin-left:2px}
.n.red{background:#B4232A}.n.blk{background:#2c3244}.n.grn{background:#047857}

/* ---------- Cards / tables ---------- */
.felt{position:relative;border-radius:18px;padding:18px 12px;background:radial-gradient(ellipse at 50% 30%,#146b4a,#0b3d2b 70%,#082a1e);border:6px solid #3a2a12;box-shadow:inset 0 0 50px rgba(0,0,0,.5),0 0 0 1px rgba(212,175,55,.35);min-height:340px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.bj-banner{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(212,175,55,.14),rgba(212,175,55,.03));border:1px solid rgba(212,175,55,.35);margin-bottom:12px;font-weight:700;font-size:14px;transition:.25s}
.bj-banner .bj-ic{font-size:19px;flex:none}
.bj-banner.win{background:linear-gradient(135deg,rgba(16,185,129,.18),rgba(16,185,129,.03));border-color:rgba(16,185,129,.45);color:#6EE7B7}
.bj-banner.lose{background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(239,68,68,.03));border-color:rgba(239,68,68,.4);color:#FCA5A5}
.bj-banner.warn{background:linear-gradient(135deg,rgba(251,191,36,.16),rgba(251,191,36,.03));border-color:rgba(251,191,36,.45);color:#FDE68A}
.bj-hint{margin:2px 4px 0;font-size:12px;color:var(--mu);min-height:16px;text-align:center}
.felt-mid{text-align:center;font-family:var(--fd);font-style:italic;color:rgba(245,215,110,.72);font-size:clamp(11px,3vw,14px)}
.zone{display:flex;flex-direction:column;align-items:center;gap:8px}
.zl{font-size:12px;font-weight:700;color:rgba(255,255,255,.75);display:flex;gap:8px;align-items:center}
.val{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 7px;border-radius:12px;background:rgba(0,0,0,.45);font-size:13px;font-weight:800;color:#fff}
.hand{display:flex;justify-content:center;min-height:calc(clamp(54px,15vw,76px)*1.4)}
.hand .card+.card{margin-left:calc(clamp(54px,15vw,76px)*-.42)}
.hands{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.hw{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:14px;border:2px solid transparent;transition:.2s}
.hw.act{border-color:rgba(245,215,110,.75);background:rgba(0,0,0,.18)}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.45)}
.tag.win,.tag.bj{background:var(--win);color:#fff}.tag.lose,.tag.bust{background:var(--lose);color:#fff}.tag.push{background:#64748b;color:#fff}
.card{width:clamp(54px,15vw,76px);aspect-ratio:5/7;border-radius:8px;background:linear-gradient(160deg,#ffffff,#eceef3);color:#111827;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.45);font-weight:800;animation:deal .38s cubic-bezier(.2,.8,.3,1.15) both;flex:none;transition:transform .2s}
.card.red{color:#C81E1E}
.card .cr{position:absolute;top:4px;left:5px;display:flex;flex-direction:column;align-items:center;line-height:1;font-size:clamp(12px,3.6vw,17px)}
.card .cr i{font-style:normal;font-size:.85em;margin-top:1px}
.card .cc{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(22px,7vw,36px)}
.card.back{background:repeating-linear-gradient(45deg,#7a5b0e 0 5px,#a98319 5px 10px);border:3px solid #f4f4f4}
.card.back>*{display:none}
@keyframes deal{from{transform:translate(50px,-70px) rotate(14deg);opacity:0}}
.card.pick{cursor:pointer}
.card.held{transform:translateY(-12px);box-shadow:0 0 0 3px var(--g1),0 10px 20px rgba(0,0,0,.5)}
.card.held::after{content:"GARDÉE";position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--g1);letter-spacing:.06em}
.vp-hand{display:flex;justify-content:center;gap:clamp(4px,1.5vw,12px);padding:16px 0 26px}
.vp-hand .card{width:clamp(54px,16vw,96px)}
.bzones{display:grid;grid-template-columns:1fr .8fr 1fr;gap:8px}
.bz{position:relative;min-height:78px;border-radius:14px;border:2px solid rgba(245,215,110,.45);background:rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;transition:background .2s}
.bz:hover{background:rgba(245,215,110,.08)}
.bz b{font-family:var(--fd);font-size:16px}.bz span{font-size:11px;color:rgba(255,255,255,.7)}
.bz .chipmark{top:8px;right:8px;transform:none;animation:none}
.bz.hit{box-shadow:0 0 0 2px var(--g1),0 0 22px rgba(245,215,110,.7)}
.bead{display:grid;grid-template-rows:repeat(6,18px);grid-auto-flow:column;grid-auto-columns:18px;gap:3px;overflow-x:auto;padding:8px;background:var(--bg);border-radius:12px;scrollbar-width:none}
.bead i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:800;color:#fff}
.bead .P{background:#2563EB}.bead .B{background:#DC2626}.bead .T{background:#059669}

/* ---------- Originals ---------- */
.cr-stage{position:relative;height:clamp(250px,54vw,380px);border-radius:16px;background:radial-gradient(ellipse at 50% 100%,#1a2340 0%,#0a0d16 65%),linear-gradient(#0e1220,#05060b);border:1px solid var(--line);overflow:hidden}
.cr-stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1.6px 1.6px at 12% 22%,#fff,transparent),radial-gradient(1.2px 1.2px at 28% 68%,#fff,transparent),radial-gradient(1.8px 1.8px at 45% 15%,#fff,transparent),radial-gradient(1.3px 1.3px at 62% 78%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 34%,#fff,transparent),radial-gradient(1.2px 1.2px at 88% 60%,#fff,transparent),radial-gradient(1.4px 1.4px at 20% 88%,#fff,transparent),radial-gradient(1.6px 1.6px at 95% 12%,#fff,transparent),radial-gradient(1.2px 1.2px at 55% 45%,#fff,transparent),radial-gradient(1.3px 1.3px at 8% 55%,#fff,transparent);opacity:.55;animation:tw 3.2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.3}to{opacity:.75}}
.cr-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.cr-m{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;font-weight:800;font-size:clamp(44px,13vw,80px);font-variant-numeric:tabular-nums;text-shadow:0 4px 30px rgba(0,0,0,.6);line-height:1}
.cr-m small{display:block;font-size:14px;font-weight:600;color:var(--mu);margin-top:8px}
.cr-m.boom{color:var(--lose)}.cr-m.ok{color:var(--win)}
.plist{margin-top:14px;display:grid;gap:4px;font-size:12.5px}
.plist div{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:6px 10px;border-radius:8px;background:var(--bg)}
.plist .ok{color:var(--win)}.plist .me{box-shadow:inset 0 0 0 1px rgba(212,175,55,.5)}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,1.6vw,10px);max-width:440px;margin:0 auto}
.mc{aspect-ratio:1;border-radius:12px;background:linear-gradient(#2c3449,#1f2537);box-shadow:0 4px 0 #0f131d;font-size:clamp(22px,7vw,34px);display:grid;place-items:center;transition:transform .12s,background .15s}
.mc:hover:not(:disabled){transform:translateY(-2px);background:linear-gradient(#374161,#28304a)}
.mc:disabled{cursor:default}
.mc.gem{background:radial-gradient(circle,#0f4a36,#0a2a1f);box-shadow:inset 0 0 0 2px var(--win),0 0 16px rgba(16,185,129,.35);animation:flip .35s}
.mc.bomb{background:radial-gradient(circle,#5a1515,#240909);box-shadow:inset 0 0 0 2px var(--lose),0 0 24px rgba(239,68,68,.55);animation:shake .4s}
.mc.ghost{opacity:.4;animation:none}
@keyframes flip{from{transform:rotateY(90deg)}}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.infos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.infos div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.infos b{display:block;font-size:16px}.infos span{font-size:11px;color:var(--mu)}
.pk-box{position:relative;max-width:640px;margin:0 auto}
.pk-box canvas{width:100%;display:block}
.pk-slots{display:flex;gap:2px;margin-top:2px}
.pk-s{flex:1;min-width:0;font-size:clamp(7px,2.1vw,11px);font-weight:800;padding:6px 0;text-align:center;border-radius:5px;color:#1a1204;transition:transform .15s}
.pk-s.hit{transform:translateY(5px);filter:brightness(1.3)}
.dice-big{text-align:center;font-weight:800;font-size:clamp(46px,13vw,80px);font-variant-numeric:tabular-nums;line-height:1;margin:10px 0 22px;transition:color .2s}
.dice-track{position:relative;padding:20px 6px 8px}
.dice-bar{height:14px;border-radius:7px}
.dice-track input[type=range]{position:absolute;left:0;right:0;top:15px;width:100%;margin:0;height:24px;background:none;-webkit-appearance:none;appearance:none}
.dice-track input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:9px;background:var(--gg);border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.5);cursor:grab}
.dice-track input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:9px;background:#D4AF37;border:3px solid #fff}
.dice-track input[type=range]::-webkit-slider-runnable-track{background:none}
.dmark{position:absolute;top:-18px;transform:translateX(-50%);transition:left .6s cubic-bezier(.2,.8,.2,1);opacity:0}
.dmark span{display:block;padding:4px 8px;border-radius:8px;font-weight:800;font-size:13px;background:#fff;color:#111}
.dmark.show{opacity:1}
.dscale{display:flex;justify-content:space-between;font-size:11px;color:var(--mu2);margin-top:10px}
.hl-row{display:flex;align-items:center;justify-content:center;gap:18px;min-height:150px}
.hl-row .card{width:clamp(80px,24vw,112px)}
.chain{display:flex;gap:6px;overflow-x:auto;padding:10px 2px;scrollbar-width:none;min-height:70px}
.chain .card{width:38px;animation:none;flex:none}
.chain .card .cc{font-size:15px}.chain .card .cr{font-size:10px}
.chain .card.skip{opacity:.45}
.kgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:clamp(4px,1.2vw,8px);max-width:560px;margin:0 auto}
.kc{aspect-ratio:1;border-radius:10px;background:var(--s3);font-weight:700;font-size:clamp(12px,3.4vw,16px);transition:transform .12s,background .2s}
.kc:hover:not(:disabled){background:var(--s4)}
.kc.pick{background:rgba(212,175,55,.2);box-shadow:inset 0 0 0 2px var(--gold);color:var(--g1)}
.kc.draw{background:#3a4466;color:#fff;animation:kpop .3s}
.kc.hit{background:var(--gg);color:#231a02;box-shadow:0 0 16px rgba(245,215,110,.6);animation:kpop .3s}
@keyframes kpop{50%{transform:scale(1.18)}}
.kpay{display:flex;gap:4px;overflow-x:auto;margin-top:14px;scrollbar-width:none}
.kpay div{flex:1;min-width:52px;text-align:center;background:var(--bg);border-radius:9px;padding:6px 4px;font-size:11px;color:var(--mu)}
.kpay div b{display:block;color:var(--tx);font-size:13px}
.kpay div.hit{background:rgba(212,175,55,.2);box-shadow:inset 0 0 0 1px var(--gold)}
.sc-card{position:relative;max-width:360px;margin:0 auto;border-radius:20px;padding:14px;background:linear-gradient(145deg,#F5D76E,#C9982A 50%,#8B6508);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.sc-card h3{margin:2px 0 10px;text-align:center;font-family:var(--fd);color:#2a1d02;font-size:22px}
.sc-area{position:relative;border-radius:14px;overflow:hidden}
.sc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff7dc;padding:10px}
.sc-cell{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(30px,9vw,42px);background:#fff;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);transition:.3s}
.sc-cell.w{background:#fff1b8;box-shadow:inset 0 0 0 3px #D4AF37}
.sc-area canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.sc-foot{text-align:center;color:#2a1d02;font-size:12px;font-weight:700;margin-top:8px}

/* ---------- Overlays ---------- */
.toasts{position:fixed;top:calc(var(--hh) + env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;z-index:130;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
@media(min-width:700px){.toasts{left:auto;align-items:flex-end}}
.toast{pointer-events:auto;background:rgba(28,33,48,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line2);border-left:3px solid var(--gold);padding:10px 14px;border-radius:12px;font-size:13.5px;max-width:380px;box-shadow:0 10px 26px rgba(0,0,0,.45);animation:tin .3s}
.toast.win{border-left-color:var(--win)}.toast.err{border-left-color:var(--lose)}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.mb{position:fixed;inset:0;z-index:120;background:rgba(3,4,8,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .2s}
.mb.out{opacity:0;transition:.2s}
.md{width:min(440px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:var(--s1);border:1px solid var(--line2);border-radius:22px;padding:24px;animation:rise .35s cubic-bezier(.2,.9,.3,1.1);text-align:center}
.md .mt{font-family:var(--fd);font-size:26px;margin:0 0 8px;line-height:1.15}
.md .mp{color:var(--mu);margin:0 0 20px}
.md .big{font-family:var(--fd);font-size:44px;font-weight:800;margin:6px 0 14px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}}
.chk{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:13px;color:var(--mu);margin:0 0 18px;cursor:pointer}
.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:#D4AF37;flex:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:140}
.bigwin{position:fixed;inset:0;z-index:135;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(0,0,0,.55),transparent 70%);animation:fade .3s}
.bigwin div{text-align:center;animation:zoom .6s cubic-bezier(.2,.9,.3,1.4)}
.bigwin h2{font-family:var(--fd);font-size:clamp(40px,11vw,86px);margin:0;line-height:1;font-weight:800;filter:drop-shadow(0 6px 30px rgba(212,175,55,.6))}
.bigwin p{font-size:clamp(24px,6vw,40px);font-weight:800;margin:10px 0 0;color:#fff;font-variant-numeric:tabular-nums}
.bigwin.out{opacity:0;transition:.4s}

<script>
'use strict';
/* ============ Utilitaires ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
const r2=n=>Math.round(n*100)/100;
const fmt=n=>{n=r2(n);return Number.isInteger(n)?n.toLocaleString('fr-FR'):n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})};
const fmtM=m=>m.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+'×';
const fmtP=p=>(p*100).toLocaleString('fr-FR',{maximumFractionDigits:2})+' %';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============ Hasard : crypto.getRandomValues ============
   Tous les tirages de jeu passent par rand(). Math.random n'est utilisé que pour
   le décor (rouleaux qui défilent, joueurs fictifs, confettis). */
let rlog=null;
const U32=new Uint32Array(2);
function rand(){crypto.getRandomValues(U32);const v=(U32[0]*2097152+(U32[1]>>>11))/9007199254740992;if(rlog)rlog.push(v);return v}
const randInt=n=>Math.floor(rand()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=randInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function pickW(list){let t=0;for(const x of list)t+=x.w;let r=rand()*t;for(const x of list){r-=x.w;if(r<0)return x}return list[list.length-1]}
function rid(){const b=new Uint8Array(5);crypto.getRandomValues(b);return [...b].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}
const rngStart=()=>{rlog=[]};
const crashDist=()=>{const r=rand();return Math.min(1e6,Math.max(1,Math.floor(96/(1-r))/100))};
function C(n,k){if(k<0||k>n)return 0;let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r}

/* ============ État persistant ============ */
const KEY='aurum_palace_v1';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const DEF=()=>({name:'Joueur',avatar:'🦁',balance:10000,wagered:0,won:0,rounds:0,best:{win:0,mult:0,game:''},fav:[],recent:[],hist:[],daily:0,refill:'',ach:{},played:{},mis:{day:'',p:{},c:{}},welcomed:false,sound:true,lim:{time:0,wager:0},jackpot:487250,bets:{},chip:{},rh:[],bh:[],cb:0});
let S=DEF();
try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);S=Object.assign(DEF(),o);S.best=Object.assign(DEF().best,o.best||{});S.lim=Object.assign(DEF().lim,o.lim||{});S.mis=Object.assign(DEF().mis,o.mis||{})}}catch(e){}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},200)}
addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}});
const sess={start:Date.now(),wag:0,won:0,g:{},lastPause:Date.now()};

/* ============ Icônes ============ */
const P={
home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
slots:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M9 5v14M15 5v14"/>',
cards:'<path d="M12 3C9.5 6.5 5 9 5 12.8a3.4 3.4 0 0 0 6 2.2L10.2 21h3.6L13 15a3.4 3.4 0 0 0 6-2.2C19 9 14.5 6.5 12 3z"/>',
zap:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
ticket:'<path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v8a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2z"/><path d="M14 6v2m0 3v2m0 3v2"/>',
heart:'<path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"/>',

crown:'<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>',
trophy:'<path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8M9 18h6"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',

scale:'<path d="M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0zM8 21h8"/>',

};
const ic=(n,s=20)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ============ Sons (Web Audio, synthétisés) ============ */
let AC;
function snd(type){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    const tone=(f,d,o='sine',v=.07,dl=0,f2)=>{const os=AC.createOscillator(),g=AC.createGain();os.type=o;os.frequency.setValueAtTime(f,t+dl);if(f2)os.frequency.exponentialRampToValueAtTime(f2,t+dl+d);g.gain.setValueAtTime(v,t+dl);g.gain.exponentialRampToValueAtTime(.0001,t+dl+d);os.connect(g).connect(AC.destination);os.start(t+dl);os.stop(t+dl+d+.02)};
    switch(type){
      case'click':tone(880,.05,'triangle',.04);break;
      case'chip':tone(2200,.03,'square',.025);tone(1500,.05,'triangle',.03,.02);break;
      case'tick':tone(1300,.025,'square',.018);break;
      case'stop':tone(160,.09,'triangle',.08);break;
      case'card':tone(2400,.03,'triangle',.025);tone(700,.05,'sine',.03,.01,300);break;
      case'win':[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.07,i*.08));break;
      case'big':[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.4,'triangle',.08,i*.09));tone(262,.9,'sine',.06,.1);break;
      case'lose':tone(330,.22,'sawtooth',.03,0,200);tone(220,.3,'sawtooth',.03,.14,130);break;
      case'boom':tone(140,.6,'sawtooth',.09,0,40);tone(90,.7,'square',.05,.05,30);break;
      case'gem':tone(1200,.12,'sine',.06,0,1800);break;
      case'coin':tone(1800,.06,'square',.03);tone(2600,.12,'triangle',.04,.05);break;
    }
  }catch(e){}
}

/* ============ Toasts, modales, effets ============ */
function toast(msg,type=''){const c=$('#toasts');const t=h(`<div class="toast ${type}">${msg}</div>`);c.appendChild(t);while(c.children.length>3)c.firstChild.remove();setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)},3400)}
function modal(html,{dismiss=true}={}){const m=h(`<div class="mb" role="dialog" aria-modal="true"><div class="md">${html}</div></div>`);document.body.appendChild(m);const close=()=>{m.classList.add('out');setTimeout(()=>m.remove(),200)};if(dismiss)m.addEventListener('click',e=>{if(e.target===m)close()});$$('[data-close]',m).forEach(b=>b.addEventListener('click',close));const f=$('button,input',m);if(f)setTimeout(()=>f.focus(),50);return{el:m,close}}
function modalMsg(t,b){modal(`<h3 class="mt">${t}</h3><p class="mp">${b}</p><button class="btn btn-gold btn-big" data-close>Compris</button>`)}

const fx=$('#fx'),fxc=fx.getContext('2d');let parts=[],fxRun=false;
function fxSize(){const d=devicePixelRatio||1;fx.width=innerWidth*d;fx.height=innerHeight*d;fxc.setTransform(d,0,0,d,0,0)}
fxSize();addEventListener('resize',fxSize);
const CC=['#F5D76E','#D4AF37','#10B981','#F43F5E','#60A5FA','#ffffff'];
function confetti(n=120,coins=false){if(REDUCED)return;for(let i=0;i<n;i++)parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:coins?7+Math.random()*6:5+Math.random()*6,c:coins&&i%2?'coin':CC[i%6]});if(!fxRun){fxRun=true;requestAnimationFrame(fxLoop)}}
function fxLoop(){fxc.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.y<innerHeight+30);for(const p of parts){p.vy+=.05;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;fxc.save();fxc.translate(p.x,p.y);fxc.rotate(p.r);if(p.c==='coin'){fxc.scale(Math.max(.15,Math.abs(Math.cos(p.r*1.4))),1);const g=fxc.createRadialGradient(-2,-2,1,0,0,p.s);g.addColorStop(0,'#FFF4B8');g.addColorStop(.55,'#E2B83E');g.addColorStop(1,'#8B6508');fxc.fillStyle=g;fxc.beginPath();fxc.arc(0,0,p.s,0,6.283);fxc.fill()}else{fxc.fillStyle=p.c;fxc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}fxc.restore()}if(parts.length)requestAnimationFrame(fxLoop);else{fxRun=false;fxc.clearRect(0,0,innerWidth,innerHeight)}}
function bigWin(win,mult){const lvl=mult>=100?'Méga gain':mult>=40?'Super gain':'Gros gain';const o=h(`<div class="bigwin"><div><h2 class="gtext">${lvl}</h2><p><span class="gold">◈</span> <span class="n">0</span></p></div></div>`);document.body.appendChild(o);snd('big');confetti(90,true);const n=$('.n',o),t0=performance.now();const st=t=>{const k=Math.min(1,(t-t0)/1400);n.textContent=fmt(win*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st);setTimeout(()=>{o.classList.add('out');setTimeout(()=>o.remove(),400)},2600)}
let wfQueue=[],wfBusy=false;
function winFlash(win,mult){
  if(win<=0)return;
  wfQueue.push({win,mult});if(wfBusy)return;playWF();
}
function playWF(){
  const item=wfQueue.shift();if(!item){wfBusy=false;return}wfBusy=true;
  const{win,mult}=item;
  const showMult=mult&&mult>=1.01&&isFinite(mult);
  const o=h(`<div class="winflash"><span class="wf-lbl">GAGNÉ</span><b class="num">+ ◈ ${fmt(win)}</b>${showMult?`<span class="wf-m">${fmtM(mult)}</span>`:''}</div>`);
  document.body.appendChild(o);
  requestAnimationFrame(()=>o.classList.add('show'));
  const dur=Math.min(2600,1400+Math.log2(1+win)*80);
  setTimeout(()=>{o.classList.remove('show');o.classList.add('hide');setTimeout(()=>{o.remove();playWF()},260)},dur);
}

/* ============ Solde et mises ============ */
let shownBal=S.balance,balAnim;
function renderBal(){const el=$('#bal-v');const from=shownBal,to=S.balance,t0=performance.now();cancelAnimationFrame(balAnim);const st=t=>{const k=Math.min(1,(t-t0)/550),e=1-Math.pow(1-k,3);shownBal=from+(to-from)*e;el.textContent=fmt(k<1?Math.round(shownBal):to);if(k<1)balAnim=requestAnimationFrame(st);else shownBal=to};balAnim=requestAnimationFrame(st);const p=$('#bal');p.classList.remove('up','down');void p.offsetWidth;if(to>from+.001)p.classList.add('up');else if(to<from-.001)p.classList.add('down');document.dispatchEvent(new Event('bal'))}
function limitOk(a){const L=S.lim;if(L.time>0&&(Date.now()-sess.start)/60000>=L.time){modalMsg('Limite de temps atteinte',`Ta session dure depuis plus de ${L.time} min, la limite que tu as fixée. Fais une pause, ou modifie la limite dans <a href="#/rg" class="gold">Jeu responsable</a>.`);return false}if(L.wager>0&&sess.wag+a>L.wager+1e-9){modalMsg('Limite de mises atteinte',`Cette mise ferait dépasser ta limite de session de ${fmt(L.wager)} ◈ (déjà misé : ${fmt(sess.wag)} ◈). Tu peux la modifier dans <a href="#/rg" class="gold">Jeu responsable</a>.`);return false}return true}
function canBet(a){a=r2(a);if(!(a>0)){toast('Choisis une mise supérieure à 0.','err');return false}if(a>S.balance+1e-9){lowBal(a);return false}return limitOk(a)}

/* ============ Historique des parties ============ */
function record(g,bet,win,info=''){
  bet=r2(bet);win=r2(win);const mult=bet>0?win/bet:0;
  const e={id:rid(),t:Date.now(),g,bet,win,mult:r2(mult),info,rng:(rlog||[]).slice(0,10).map(v=>v.toFixed(6))};rlog=null;
  S.hist.unshift(e);if(S.hist.length>150)S.hist.length=150;
  S.rounds++;S.played[g]=(S.played[g]||0)+1;
  const sg=sess.g[g]||(sess.g[g]={bet:0,win:0,n:0});sg.bet+=bet;sg.win+=win;sg.n++;
  if(win>S.best.win)S.best={...S.best,win,game:g};
  if(bet>0&&mult>S.best.mult)S.best.mult=r2(mult);
  const rate=LEVELS[lvl()].cb;if(rate&&win<bet)S.cb=r2((S.cb||0)+(bet-win)*rate);
  missionTick(e);
  if(win>bet&&bet>0)unlock('first');
  if(S.rounds>=100)unlock('r100');if(S.rounds>=1000)unlock('r1000');
  if(bet>0&&mult>=50)unlock('x50');
  if(Object.keys(S.played).length>=10)unlock('ten');
  if(bet>0&&mult>=15)bigWin(win,mult);
  else if(win>0)winFlash(win,bet>0?mult:0);
  save();vipCheck();
  document.dispatchEvent(new CustomEvent('round',{detail:e}));
  return e;
}

  m.innerHTML=`<h1 class="ph">${title}</h1><p class="psub">${sub}</p>
  ${search?`<label class="hsearch" style="display:flex;margin:0 0 14px;max-width:none">${ic('search',18)}<input id="lsearch" type="search" placeholder="Rechercher un jeu" autocomplete="off"></label>`:''}
  ${filters?`<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px"><div class="chips" id="fv">${['Toutes','Faible','Moyenne','Haute','Réglable'].map((v,i)=>`<button class="chip ${i?'':'on'}" data-v="${v}">${i?'Volatilité '+v.toLowerCase():'Toutes volatilités'}</button>`).join('')}</div><select class="sel" id="fs" aria-label="Trier"><option value="pop">Populaires</option><option value="az">A à Z</option><option value="new">Nouveautés</option><option value="rtp">RTP le plus haut</option></select></div>`:''}
  <div class="ggrid" id="gg"></div>`;
  let vol='Toutes',sort='pop',q=q0;
  const rtpN=g=>parseFloat(g.rtp.replace(',','.').replace(/[^\d.]/g,''))||0;
  const draw=()=>{let L=list.filter(g=>(vol==='Toutes'||g.vol===vol)&&(!q||g.name.toLowerCase().includes(q.toLowerCase())||CATS[g.cat].n.toLowerCase().includes(q.toLowerCase())));
    if(sort==='az')L=[...L].sort((a,b)=>a.name.localeCompare(b.name,'fr'));if(sort==='new')L=[...L].sort((a,b)=>(b.badge==='new')-(a.badge==='new'));if(sort==='rtp')L=[...L].sort((a,b)=>rtpN(b)-rtpN(a));if(sort==='pop')L=[...L].sort((a,b)=>(b.pop||0)-(a.pop||0));
    $('#gg',m).innerHTML=L.length?L.map(gcard).join(''):`<div class="empty" style="grid-column:1/-1">${empty||'<b>Aucun jeu ne correspond</b>Essaie un autre filtre ou un autre mot-clé.'}</div>`;bindFavs(m)};
  if(filters){$$('#fv .chip',m).forEach(c=>c.addEventListener('click',()=>{vol=c.dataset.v;$$('#fv .chip',m).forEach(x=>x.classList.toggle('on',x===c));draw()}));$('#fs',m).addEventListener('change',e=>{sort=e.target.value;draw()})}
  if(search){const i=$('#lsearch',m);i.value=q;i.addEventListener('input',()=>{q=i.value;draw()});if(q)i.focus()}
  draw();
}
V.games=(m,arg)=>listView(m,{title:'Tous les jeux',sub:`${GL.length} jeux jouables avec tes jetons ◈.`,list:GL,search:true,q:arg?decodeURIComponent(arg):''});
V.cat=(m,k)=>{const c=CATS[k]||CATS.slots;listView(m,{title:c.n,sub:c.d+'.',list:GL.filter(g=>g.cat===(CATS[k]?k:'slots'))})};
V.fav=m=>listView(m,{title:'Favoris',sub:'Touche le cœur d’un jeu pour le retrouver ici.',list:S.fav.map(id=>GAMES[id]).filter(Boolean),filters:false,empty:'<b>Aucun favori pour l’instant</b>Ajoute un jeu avec le cœur en haut à droite de sa vignette.'});
V.recent=m=>listView(m,{title:'Récemment joués',sub:'Tes derniers jeux, du plus récent au plus ancien.',list:S.recent.map(id=>GAMES[id]).filter(Boolean),filters:false,empty:'<b>Tu n’as encore rien joué</b><a class="gold" href="#/lobby">Choisis un jeu dans le lobby</a>.'});

/* ============ Page de jeu ============ */
const when=t=>{const d=new Date(t);return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})};
V.game=(m,id)=>{
  const g=GAMES[id];if(!g){location.hash='#/lobby';return}
  S.recent=[id,...S.recent.filter(x=>x!==id)].slice(0,12);save();
  m.innerHTML=`<div class="gp-head"><a class="hbtn" href="#/lobby" aria-label="Retour au lobby">${ic('back')}</a><div class="gp-t"><h1>${g.name}</h1><span>${CATS[g.cat].n} · RTP ${g.rtp} · Volatilité ${g.vol.toLowerCase()}</span></div><button class="hbtn fav ${isFav(id)?'on':''}" id="gfav" aria-label="Favori">${ic('heart')}</button></div>
  <div class="gp"><section class="stage" id="stage"></section><aside class="gside pan"><div class="tabs" role="tablist"><button class="tab on" data-t="h" role="tab">Historique</button><button class="tab" data-t="s" role="tab">Session</button><button class="tab" data-t="r" role="tab">Règles</button></div><div id="gtab"></div></aside></div>`;
  $('#gfav',m).addEventListener('click',e=>{const on=toggleFav(id);e.currentTarget.classList.toggle('on',on);toast(on?'Ajouté à tes favoris':'Retiré de tes favoris')});
  let tab='h';
  const drawTab=()=>{const T=$('#gtab',m);if(!T)return;
    if(tab==='h'){const L=S.hist.filter(e=>e.g===id).slice(0,20);T.innerHTML=L.length?L.map(e=>`<div class="hrow"><div><div>◈ ${fmt(e.bet)} ${e.info?`<span class="mu2">· ${esc(e.info)}</span>`:''}</div><div class="t">${when(e.t)} · n° ${e.id}</div></div><span class="pill ${e.bet===0?'y':e.win>e.bet?'g':e.win===0?'r':''}">${e.bet?fmtM(e.mult):'Offert'}</span><b class="num ${e.win>e.bet?'pos':e.win<e.bet?'neg':''}">${e.win>0?'+'+fmt(e.win):'0'}</b></div>`).join(''):'<div class="empty"><b>Aucune partie</b>Tes 20 derniers coups apparaîtront ici.</div>'}
    else if(tab==='s'){const s=sess.g[id]||{bet:0,win:0,n:0};const net=s.win-s.bet;const mins=Math.floor((Date.now()-sess.start)/60000);T.innerHTML=`<div class="stats"><div class="st"><b>${s.n}</b><span>Parties sur ce jeu</span></div><div class="st"><b>◈ ${fmt(s.bet)}</b><span>Misé</span></div><div class="st"><b>◈ ${fmt(s.win)}</b><span>Gagné</span></div><div class="st"><b class="${net>0?'pos':net<0?'neg':''}">${net>0?'+':''}${fmt(net)}</b><span>Résultat net</span></div></div><p class="mu" style="font-size:12.5px;margin:14px 0 0">Session en cours : ${mins} min · ${fmt(sess.wag)} ◈ misés tous jeux confondus.</p>`}
    else T.innerHTML=`<div class="rules">${typeof g.rules==='function'?g.rules():g.rules}</div>`};
  $$('.tab',m).forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.t;$$('.tab',m).forEach(x=>x.classList.toggle('on',x===b));drawTab()}));
  drawTab();
  const onR=e=>{if(e.detail.g===id&&tab!=='r')drawTab()};document.addEventListener('round',onR);
  const d=g.init($('#stage',m));
  destroy=()=>{document.removeEventListener('round',onR);d&&d()};
};

/* ============ Roue générique (SVG) ============ */
function wheelSVG(segs,{r=140,inner=0,font=11,id='w'}={}){const totW=segs.reduce((a,s)=>a+(s.w2||1),0);const pt=(rad,deg)=>[rad*Math.sin(deg*Math.PI/180),-rad*Math.cos(deg*Math.PI/180)];
  let acc=0,s=`<g id="${id}" style="transform-origin:0 0">`;
  segs.forEach(g=>{const w=g.w2||1;const width=w/totW*360;const center=acc/totW*360;acc+=w;const t1=center-width/2,t2=center+width/2;const large=width>180?1:0;
    const[x1,y1]=pt(r,t1),[x2,y2]=pt(r,t2),[x3,y3]=pt(inner,t2),[x4,y4]=pt(inner,t1);
    s+=`<path d="M${x1.toFixed(2)} ${y1.toFixed(2)}A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}L${x3.toFixed(2)} ${y3.toFixed(2)}${inner?`A${inner} ${inner} 0 ${large} 0 ${x4.toFixed(2)} ${y4.toFixed(2)}`:''}Z" fill="${g.c}" stroke="rgba(0,0,0,.35)" stroke-width="1"/><text transform="rotate(${center}) translate(0 ${-(r-(r-inner)*.42)})" text-anchor="middle" dominant-baseline="middle" font-size="${g.fs||font}" font-weight="800" fill="${g.tc||'#fff'}" font-family="Inter,sans-serif">${g.l}</text>`});
  return s+'</g>'}
function wheelCenterAngle(segs,idx){const totW=segs.reduce((a,s)=>a+(s.w2||1),0);let acc=0;for(let i=0;i<idx;i++)acc+=(segs[i].w2||1);return acc/totW*360}
function wheelPick(segs){let t=0;for(const s of segs)t+=(s.w2||1);let r=rand()*t;for(let i=0;i<segs.length;i++){r-=(segs[i].w2||1);if(r<0)return i}return segs.length-1}

/* ============ Promotions ============ */
const DAILY=[500,1000,750,2500,500,1500,1000,5000];
const DCOL=['#1C2130','#B8860B','#262C3F','#10B981','#1C2130','#7C3AED','#262C3F','#E11D48'];
V.promo=m=>{
  const L=LEVELS[lvl()];const ms=todaysMissions();save();
  const next=()=>S.daily+864e5-Date.now();
  m.innerHTML=`<h1 class="ph">Promotions</h1><p class="psub">Des jetons gratuits chaque jour. Ton niveau VIP ${L.n} multiplie la roue par ${String(L.b).replace('.',',')}.</p>

  <div class="wheel-mini"><div class="wheel-ptr"></div><svg viewBox="-150 -150 300 300"><circle r="148" fill="#0B0D12" stroke="#D4AF37" stroke-width="4"/>${wheelSVG(DAILY.map((v,i)=>({l:fmt(v*L.b),c:DCOL[i],fs:13})),{r:140,inner:34,id:'dw'})}<circle r="30" fill="#0B0D12" stroke="#F5D76E" stroke-width="3"/><text text-anchor="middle" dy=".35em" fill="#F5D76E" font-size="22" font-weight="800">◈</text></svg></div>

  <div class="grid2" style="margin-top:14px"><div class="pan"><h3 style="font-family:var(--fd);margin:0 0 6px">Bonus de bienvenue</h3><p class="mu" style="margin:0;font-size:14px">10 000 ◈ crédités à ton arrivée au Palace. ${S.welcomed?'<span class="pos">Déjà reçu.</span>':''}</p></div>
  <div class="pan"><h3 style="font-family:var(--fd);margin:0 0 6px">Recharge gratuite</h3><p class="mu" style="margin:0 0 12px;font-size:14px">Sous 1 000 ◈ ? Reçois 5 000 ◈, une fois par jour.</p><button class="btn btn-ghost" id="refill"></button></div></div>`;
  const dsp=$('#dspin',m),g=$('#dw',m);let rot=0,busy=false;
  const upd=()=>{const t=next();if(busy)return;if(t<=0){dsp.disabled=false;dsp.textContent='Tourner la roue'}else{dsp.disabled=true;const hh=Math.floor(t/36e5),mm=Math.floor(t%36e5/6e4),ss=Math.floor(t%6e4/1e3);dsp.textContent=`Prochain tour dans ${hh} h ${String(mm).padStart(2,'0')} min ${String(ss).padStart(2,'0')} s`}};
  upd();const iv=setInterval(upd,1000);
  dsp.addEventListener('click',()=>{if(next()>0||busy)return;busy=true;dsp.disabled=true;dsp.textContent='La roue tourne…';const i=randInt(DAILY.length);const a=360/DAILY.length;rot+=360*6+(((-i*a-rot)%360)+360)%360;g.style.transition='transform 4.5s cubic-bezier(.15,.7,.1,1)';g.style.transform=`rotate(${rot}deg)`;const tk=setInterval(()=>snd('tick'),120);
    setTimeout(()=>{clearInterval(tk);const v=DAILY[i]*L.b;S.daily=Date.now();give(v);S.won=r2(S.won-v);save();snd('big');confetti(100,true);modal(`<div style="font-size:48px">🎁</div><h3 class="mt">Bonus du jour</h3><div class="big gtext">+ ${fmt(v)} ◈</div><button class="btn btn-gold btn-big" data-close>Super</button>`);busy=false;upd()},4600)});
  const drawM=()=>{$('#mis',m).innerHTML=ms.map(x=>{const p=S.mis.p[x.id]||0,done=p>=x.n,cl=S.mis.c[x.id];return `<div class="mis"><div class="mi"><b>${x.t}</b><span class="mu" style="font-size:12px">${fmt(Math.min(p,x.n))} / ${fmt(x.n)} · récompense ${fmt(x.r)} ◈</span><div class="bar"><i style="width:${Math.min(100,p/x.n*100)}%"></i></div></div><button class="btn btn-sm ${done&&!cl?'btn-gold':'btn-ghost'}" data-m="${x.id}" ${done&&!cl?'':'disabled'}>${cl?'Reçu':done?'Récupérer':'En cours'}</button></div>`}).join('');
    $$('[data-m]',m).forEach(b=>b.addEventListener('click',()=>{const x=ms.find(y=>y.id===b.dataset.m);S.mis.c[x.id]=1;give(x.r);S.won=r2(S.won-x.r);save();snd('coin');confetti(50,true);toast(`+ ${fmt(x.r)} ◈ reçus`,'win');drawM()}))};

/* ============ Classement ============ */
V.board=m=>{
  const wk=Math.floor((Date.now()/864e5+3)/7);let x=wk*9301+49297;const rnd=()=>{x=(Math.imul(x,1103515245)+12345)>>>0;return x/4294967296};
  const players=NAMES.concat(NAMES.map(n=>n+'_'+Math.floor(rnd()*90+10))).slice(0,58).map(n=>({n,a:['🦊','🐯','🦅','🐺','🦄','🐉','🦁','🐼','🐙','🦈'][Math.floor(rnd()*10)],win:Math.round(Math.pow(rnd(),3)*480000+2500),wag:Math.round(Math.pow(rnd(),2.2)*9e6+40000)}));
  const me={n:S.name+' (toi)',a:S.avatar,win:S.best.win,wag:S.wagered,me:true};
  let mode='win';
  m.innerHTML=`<h1 class="ph">Classement de la semaine</h1><p class="psub">Remis à zéro chaque lundi. Les autres joueurs sont fictifs : le Palace est un casino de démonstration.</p><div class="seg" style="max-width:360px;margin-bottom:14px"><button class="on" data-k="win">Plus gros gain</button><button data-k="wag">Total misé</button></div><div id="lb"></div>`;
  const draw=()=>{const all=[...players,me].sort((a,b)=>b[mode]-a[mode]);const pos=all.indexOf(me);const top=all.slice(0,50);
    $('#lb',m).innerHTML=top.map((p,k)=>`<div class="lb-row ${p.me?'me':''}"><span class="rk ${k<3?'t'+(k+1):''}">${k+1}</span><span class="pn"><span>${p.a}</span><span>${esc(p.n)}</span></span><b class="num">◈ ${fmt(p[mode])}</b></div>`).join('')+(pos>=50?`<p class="mu" style="text-align:center">…</p><div class="lb-row me"><span class="rk">${pos+1}</span><span class="pn"><span>${me.a}</span><span>${esc(me.n)}</span></span><b class="num">◈ ${fmt(me[mode])}</b></div>`:'')};
  $$('.seg button',m).forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.k;$$('.seg button',m).forEach(y=>y.classList.toggle('on',y===b));draw()}));draw();
};

function evalLine(seq,pays,wildK,scK){
  let wn=0;while(wn<seq.length&&seq[wn]===wildK)wn++;
  let t=null,n=0;for(const s of seq){if(s===scK)break;if(s===wildK){n++;continue}if(t===null){t=s;n++;continue}if(s===t){n++;continue}break}
  let best=0,type=null,count=0;
  if(t&&pays[t]&&pays[t][n]){best=pays[t][n];type=t;count=n}
  if(wn>=3&&pays[wildK]&&pays[wildK][wn]>best){best=pays[wildK][wn];type=wildK;count=wn}
  return{amt:best,type,count};
}

function slotMachine(cfg){
  return function init(stage){
    const cols=cfg.cols,rows=cfg.rows;
    const totalW=cfg.syms.reduce((a,s)=>a+s.w,0);
    const payMap=Object.fromEntries(cfg.syms.filter(s=>s.p).map(s=>[s.k,s.p]));
    stage.innerHTML=`
      <div class="slot-marquee gtext">${cfg.title}</div>
      <div class="slot-wrap"><div class="fsb" id="fsb" style="display:none"></div>
      <div class="slot ${cfg.skin||''}" style="--cols:${cols};--rows:${rows}" id="reels"></div></div>
      <div class="msg" id="msg" aria-live="polite">&nbsp;</div>
      <div class="ctrl">
        <div class="ctrl-row" id="betrow"></div>
        <div class="ctrl-row"><button class="btn btn-ghost" id="auto" style="flex:1">Auto ×10</button><button class="btn btn-gold btn-big" id="spin" style="flex:2">Lancer</button></div>
      </div>`;
    const reelsEl=$('#reels',stage);
    for(let c=0;c<cols;c++){const r=h(`<div class="reel"></div>`);for(let k=0;k<rows;k++)r.appendChild(h(`<div class="cell"></div>`));reelsEl.appendChild(r)}
    const bc=betCtl(cfg.id,cfg.def,{});$('#betrow',stage).appendChild(bc.el);
    const spinBtn=$('#spin',stage),autoBtn=$('#auto',stage),msg=$('#msg',stage),fsb=$('#fsb',stage);
    const cellHTML=s=>/^[0-9A-Z]{1,2}$/.test(s.g)?`<span class="ltb" data-r="${s.k}"><i>${s.g}</i></span>`:`<span class="sy">${s.g}</span>`;
    // grille de repos affichée avant le premier lancement
    const restGrid=()=>Array.from({length:cols},()=>Array.from({length:rows},()=>pickW(cfg.syms)));
    const paint=(grid,winCells=[])=>{for(let c=0;c<cols;c++){const cells=reelsEl.children[c].children;for(let r=0;r<rows;r++){const s=grid[c][r];cells[r].innerHTML=cellHTML(s);cells[r].classList.remove('dim');cells[r].classList.toggle('w',winCells.some(w=>w[0]===c&&w[1]===r))}}
      if(winCells.length)for(let c=0;c<cols;c++)for(let r=0;r<rows;r++)if(!winCells.some(w=>w[0]===c&&w[1]===r))reelsEl.children[c].children[r].classList.add('dim')};
    paint(restGrid());
    let freeSpins=0,fsTotal=0,fsWin=0,busy=false,auto=0;
    const setFS=()=>{fsb.style.display=freeSpins>0?'':'none';fsb.textContent=freeSpins>0?`TOURS GRATUITS — ${fsTotal-freeSpins+1} / ${fsTotal}`:''};

    async function spinOnce(){
      const bet=freeSpins>0?0:bc.get();
      if(freeSpins===0&&!canBet(bet))return false;
      busy=true;spinBtn.disabled=true;autoBtn.disabled=true;bc.lock(true);msg.textContent='\u00A0';msg.className='msg';
      if(freeSpins===0){take(bet);freeSpins===0&&0}
      $$('.reel',reelsEl).forEach(r=>{r.classList.add('spin');r.classList.remove('stop');$$('.cell',r).forEach(c=>c.classList.remove('w','dim'))});
      rngStart();
      const grid=[];for(let c=0;c<cols;c++){const col=[];for(let r=0;r<rows;r++)col.push(pickW(cfg.syms));grid.push(col)}
      snd('click');
      for(let c=0;c<cols;c++){
        await sleep(220+c*160);
        const r=reelsEl.children[c];r.classList.remove('spin');r.classList.add('stop');
        for(let k=0;k<rows;k++)r.children[k].innerHTML=cellHTML(grid[c][k]);
        snd('stop');
      }
      await sleep(140);
      let win=0;const winCells=[];let scatterCount=0;let bestType=null;
      for(const ln of cfg.lines){
        const seq=ln.map((row,c)=>grid[c][row].k);
        const res=evalLine(seq,payMap,'W','S');
        if(res.amt>0){win+=res.amt*bet_unit()/cfg.lines.length;for(let c=0;c<res.count;c++)winCells.push([c,ln[c]]);if(!bestType||res.amt>bestType.amt)bestType=res}
      }
      function bet_unit(){return freeSpins>0?fsBetRef:bet}
      const flat=grid.flat();scatterCount=flat.filter(s=>s.k==='S').length;
      let scWin=0;
      if(cfg.scatterPay&&scatterCount>=3)scWin=cfg.scatterPay[scatterCount]*bet_unit()||0;
      win=r2(win+scWin);
      if(winCells.length)paint(grid,winCells);
      let triggeredFS=false;
      if(cfg.freeSpins&&scatterCount>=cfg.freeSpins.need){
        if(freeSpins===0){freeSpins=cfg.freeSpins.count;fsTotal=cfg.freeSpins.count;fsWin=0;fsBetRef=bet;triggeredFS=true}
        else{freeSpins+=cfg.freeSpins.retrigger||0}
      }
      let jpWin=0;
      if(cfg.jackpot&&bestType&&bestType.count>=cfg.cols&&bestType.type===cfg.jackpot.sym){jpWin=S.jackpot;S.jackpot=cfg.jackpot.reset;unlock('jp')}
      const totalWin=r2(win+jpWin);
      if(freeSpins>0&&!triggeredFS){fsWin=r2(fsWin+totalWin);freeSpins--}
      if(totalWin>0){give(totalWin);snd(totalWin/Math.max(1,bet_unit())>=10?'big':'win')}
      else if(!triggeredFS)snd('lose');
      if(triggeredFS){snd('gem');toast(`${cfg.freeSpins.need} symboles Scatter : ${cfg.freeSpins.count} tours gratuits !`,'win')}
      setFS();
      const label=jpWin?`JACKPOT ◈ ${fmt(jpWin)} !`:totalWin>0?`Gagné ◈ ${fmt(totalWin)}`:triggeredFS?'Tours gratuits déclenchés !':'Perdu, réessaie';
      msg.textContent=label;msg.className='msg '+(totalWin>0||triggeredFS?'w':'l');
      record(cfg.id,bet,totalWin,triggeredFS?'Tours gratuits déclenchés':scatterCount>=3?`${scatterCount} Scatters`:'');
      busy=false;spinBtn.disabled=false;autoBtn.disabled=false;bc.lock(false);
      return true;
    }
    let fsBetRef=0;
    spinBtn.addEventListener('click',async()=>{if(busy)return;await spinOnce()});
    autoBtn.addEventListener('click',async()=>{if(busy)return;if(auto>0){auto=0;autoBtn.textContent='Auto ×10';return}auto=10;autoBtn.textContent='Arrêter';while(auto>0&&!busy){auto--;const ok=await spinOnce();if(!ok){auto=0;break}await sleep(280)}autoBtn.textContent='Auto ×10'});
    return()=>{auto=0};
  };
}

      const last12=S.rh.slice(0,12);const rc=last12.filter(n=>isRed(n)).length,bc=last12.filter(n=>isRed(n)===false).length;
      const counts={};S.rh.slice(0,80).forEach(n=>counts[n]=(counts[n]||0)+1);const hot=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3);

      take(tot);

      const target=360*7-idx*seg-seg/2;const rot=cur - (cur%360) + target;wheel._rot=rot;
      wheel.style.transition='transform 4.2s cubic-bezier(.12,.7,.15,1)';wheel.style.transform=`rotate(${rot}deg)`;
      const tk=setInterval(()=>snd('tick'),110);

      win=r2(win);

function bjVal(hand){let v=0,aces=0;for(const c of hand){if(c.r==='A'){v+=11;aces++}else if(['K','Q','J'].includes(c.r))v+=10;else v+=+c.r}
  while(v>21&&aces>0){v-=10;aces--}return v}

    let shoe=[],dealer=[],hands=[],cur=0,phase='bet',insurance=0,bet0=0;

const VP_PAY={'Quinte flush royale':[250,500,750,1000,4000],'Quinte flush':[50,100,150,200,250],'Carré':[25,50,75,100,125],'Full':[9,18,27,36,45],'Couleur':[6,12,18,24,30],'Suite':[4,8,12,16,20],'Brelan':[3,6,9,12,15],'Double paire':[2,4,6,8,10],'Paire de Valets ou mieux':[1,2,3,4,5]};
function vpRank(cards){
  const rv={A:14,K:13,Q:12,J:11,'10':10,9:9,8:8,7:7,6:6,5:5,4:4,3:3,2:2};
  const vals=cards.map(c=>rv[c.r]).sort((a,b)=>a-b);const suits=cards.map(c=>c.s);
  const flush=suits.every(s=>s===suits[0]);
  const uniq=[...new Set(vals)];let straight=uniq.length===5&&vals[4]-vals[0]===4;
  const wheel=JSON.stringify(vals)===JSON.stringify([2,3,4,5,14]);if(wheel)straight=true;
  const counts={};vals.forEach(v=>counts[v]=(counts[v]||0)+1);const cs=Object.values(counts).sort((a,b)=>b-a);
  const highVals=wheel?[5,4,3,2,1]:vals;
  if(flush&&straight&&Math.min(...highVals)===10&&!wheel)return'Quinte flush royale';
  if(flush&&straight)return'Quinte flush';
  if(cs[0]===4)return'Carré';
  if(cs[0]===3&&cs[1]===2)return'Full';
  if(flush)return'Couleur';
  if(straight)return'Suite';
  if(cs[0]===3)return'Brelan';
  if(cs[0]===2&&cs[1]===2)return'Double paire';
  if(cs[0]===2){const pairVal=+Object.keys(counts).find(k=>counts[k]===2);if(pairVal>=11)return'Paire de Valets ou mieux'}
  return null;
}

      const win=r2(bet*seg.m);
      if(win>0){give(win);snd(seg.m>=10?'big':'win')}else snd('lose');
      msg.textContent=`La roue s’arrête sur ${seg.l} — ${win>0?'Gagné ◈ '+fmt(win):'Perdu'}`;msg.className='msg '+(win>0?'w':'l');
      record('wheel',bet,win,`Segment ${seg.l}`);
      busy=false;go.disabled=false;bc.lock(false);
    });
    return()=>{};
  },
  rules:()=>`<h4>Roue de la Fortune</h4><p>La roue comporte des tranches de tailles différentes, comme une vraie roue de casino : les petits gains (×0, ×0,5, ×1) occupent une grande partie de la roue, tandis que le ×20 n’occupe qu’une fine tranche rare. Ta mise est multipliée par le segment sur lequel s’arrête le repère.</p>
  <p class="mu2" style="font-size:12px">RTP théorique ≈ 90 %.</p>`});

/* ============ Cartes à gratter ============ */
const SCRATCH_THEMES=[
 {id:'gold',name:'Trésor Doré',syms:['💰','💎','7️⃣','👑','⭐','🔔','🍇','🟡','🎖️','🍒','🔶','🥉']},
 {id:'fruit',name:'Verger Chanceux',syms:['🍉','🍓','🍍','🍑','🍇','🍊','🍋','🍏','🍒','🫐','🍈','🥝']},
 {id:'egypt',name:'Pyramide d’Or',syms:['👑','𓁹','⚱️','🐫','🏺','🦂','🐍','🌙','☀️','⭐','🪨','🧿']}];
const SCRATCH_W=[1,2,3,4,6,8,10,12,14,16,16,16];
const SCRATCH_PAYT=[53.4,26.7,17.8,11.1,6.7,4,2.7,1.8,1.3,0.9,0.9,0.7];
reg({id:'scratch',name:'Cartes à Gratter',cat:'instant',rtp:'90 %',vol:'Faible',badge:null,pop:38,
  bg:'radial-gradient(circle at 50% 30%,#3a3008,#121002)',glyph:'🎟️',
  init(stage){
    let theme=SCRATCH_THEMES[0];
    stage.innerHTML=`<div class="chips" id="themes" style="margin-bottom:14px">${SCRATCH_THEMES.map((t,i)=>`<button class="chip ${i?'':'on'}" data-t="${t.id}">${t.name}</button>`).join('')}</div>
    <div class="sc-card"><h3 id="sctitle">${theme.name}</h3><div class="sc-area"><div class="sc-grid" id="sg"></div><canvas id="sc"></canvas></div><div class="sc-foot" id="scfoot">Gratte les 9 cases — 3 symboles identiques gagnent</div></div>
    <div class="msg" id="msg">&nbsp;</div>
    <div class="ctrl"><div class="ctrl-row" id="betrow"></div><button class="btn btn-gold btn-big" id="go">Acheter une carte</button></div>`;
    const bc=betCtl('scratch',50,{label:'Prix de la carte'});$('#betrow',stage).appendChild(bc.el);
    const sg=$('#sg',stage),cv=$('#sc',stage),ctx=cv.getContext('2d'),go=$('#go',stage),msg=$('#msg',stage),scfoot=$('#scfoot',stage),sctitle=$('#sctitle',stage);
    $$('#themes .chip',stage).forEach(c=>c.addEventListener('click',()=>{theme=SCRATCH_THEMES.find(t=>t.id===c.dataset.t);sctitle.textContent=theme.name;$$('#themes .chip',stage).forEach(x=>x.classList.toggle('on',x===c));reset()}));
    let grid=[],scratched=new Set(),bet=0,active=false,drawing=false;
    function pickIdx(){const tot=SCRATCH_W.reduce((a,w)=>a+w,0);let r=rand()*tot;for(let i=0;i<SCRATCH_W.length;i++){r-=SCRATCH_W[i];if(r<0)return i}return SCRATCH_W.length-1}
    function sizeCv(){const r=sg.getBoundingClientRect();const d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cv.style.width=r.width+'px';cv.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);coverAll(r.width,r.height)}
    function coverAll(w,hh){ctx.clearRect(0,0,w,hh);const g=ctx.createLinearGradient(0,0,w,hh);g.addColorStop(0,'#C9C9D4');g.addColorStop(1,'#9EA0AE');ctx.fillStyle=g;ctx.fillRect(0,0,w,hh);ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='bold 13px Inter';for(let i=0;i<18;i++)ctx.fillText('◈',Math.random()*w,Math.random()*hh)}
    function reset(){grid=[];sg.innerHTML='';for(let i=0;i<9;i++){const idx=pickIdx();grid.push(idx);sg.appendChild(h(`<div class="sc-cell">${theme.syms[idx]}</div>`))}scratched=new Set();sizeCv();active=false;scfoot.textContent='Achète une carte pour commencer';}
    const ro=new ResizeObserver(sizeCv);ro.observe(cv);
    reset();
    function cellAt(x,y){const r=sg.getBoundingClientRect();const cw=r.width/3,ch=r.height/3;const cx=Math.min(2,Math.max(0,Math.floor(x/cw))),cy=Math.min(2,Math.max(0,Math.floor(y/ch)));return cy*3+cx}
    function scratchAt(clientX,clientY){const r=cv.getBoundingClientRect();const x=clientX-r.left,y=clientY-r.top;ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,22,0,6.283);ctx.fill();ctx.globalCompositeOperation='source-over';
      const idx=cellAt(x,y);if(!scratched.has(idx)){scratched.add(idx);sg.children[idx].classList.add('w');if(scratched.size===9)finish()}}
    function pos(e){if(e.touches)return[e.touches[0].clientX,e.touches[0].clientY];return[e.clientX,e.clientY]}
    cv.addEventListener('pointerdown',e=>{if(!active)return;drawing=true;const[x,y]=pos(e);scratchAt(x,y)});
    cv.addEventListener('pointermove',e=>{if(!active||!drawing)return;const[x,y]=pos(e);scratchAt(x,y)});
    addEventListener('pointerup',()=>drawing=false);
    function finish(){
      active=false;const counts={};grid.forEach(s=>counts[s]=(counts[s]||0)+1);
      let win=0,winIdx=null;for(const[s,c] of Object.entries(counts))if(c>=3&&SCRATCH_PAYT[s]*bet>win){win=SCRATCH_PAYT[s]*bet;winIdx=+s}
      win=r2(win);
      if(win>0){give(win);snd(win/bet>=15?'big':'win');scfoot.textContent=`3× ${theme.syms[winIdx]} — Gagné ◈ ${fmt(win)} !`}else{snd('lose');scfoot.textContent='Pas de combinaison — Perdu'}
      msg.textContent=win>0?`Gagné ◈ ${fmt(win)}`:'Perdu, retente ta chance';msg.className='msg '+(win>0?'w':'l');
      record('scratch',bet,win,winIdx!=null?`3× ${theme.syms[winIdx]}`:'');
      go.disabled=false;bc.lock(false);
    }
    go.addEventListener('click',()=>{
      const b=bc.get();if(!canBet(b))return;bet=b;take(bet);go.disabled=true;bc.lock(true);rngStart();
      reset();active=true;msg.textContent='\u00A0';msg.className='msg';scfoot.textContent='Gratte les 9 cases avec la souris ou le doigt';snd('click');
    });
    return()=>{ro.disconnect()};
