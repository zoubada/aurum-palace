<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<title>Aurum Palace — Casino social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="loader" id="loader"><div><div class="lm" id="lmark"></div><p class="gtext">Aurum Palace</p></div></div>

<header class="top"><div class="top-in">
  <a class="logo" href="#/lobby" aria-label="Aurum Palace, accueil"><span id="logo-mark"></span><span class="logo-t">Aurum <span class="gtext">Palace</span><small>CASINO SOCIAL</small></span></a>
  <label class="hsearch"><span id="hs-ic"></span><input id="hsearch" type="search" placeholder="Rechercher un jeu" autocomplete="off"></label>
  <span class="hsp"></span>
  <div class="bal" id="bal"><span class="cur">◈</span><span class="v num" id="bal-v">0</span><button class="bal-eye" id="bal-eye" aria-label="Masquer le solde" type="button"></button><a class="add" href="#/promo" aria-label="Obtenir des jetons gratuits" id="bal-add"></a></div>
  <button class="hbtn hide-s gift" id="btn-gift" aria-label="Bonus quotidien"></button>
  <button class="hbtn hide-s" id="btn-snd" aria-label="Couper ou activer le son"></button>
  <a class="av" id="avatar" href="#/profile" aria-label="Mon profil"></a>
</div></header>

<nav class="side" id="side" aria-label="Navigation principale"></nav>
<main class="main" id="main"></main>
<nav class="bnav" aria-label="Navigation mobile"><div class="bnav-in" id="bnav"></div></nav>

<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- Cœur du moteur : utilitaires, hasard, état, presentation -->
<script src="js/utils.js"></script>
<script src="js/rng.js"></script>

<script src="js/betting-ui.js"></script>
<script src="js/cards.js"></script>
<script src="js/fake-players.js"></script>
<script src="js/registry.js"></script>
<script src="js/shell.js"></script>
<script src="js/router.js"></script>

<!-- Pages -->
<script src="js/views/lobby.js"></script>
<script src="js/views/catalog.js"></script>
<script src="js/wheel-svg.js"></script>
<script src="js/views/account.js"></script>

<!-- Jeux (chaque fichier s'enregistre via reg({...}) dans le catalogue) -->
<script src="js/games/slots.js"></script>

<!-- Démarrage de l'application -->
<script src="js/main.js"></script>
</body>
</html>
